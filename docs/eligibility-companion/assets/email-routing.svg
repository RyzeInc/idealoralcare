<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="216" viewBox="0 0 1048 216" role="img" aria-labelledby="email-routing-title email-routing-desc"><title id="email-routing-title">How organization email routing works</title><desc id="email-routing-desc">An authorized sender emails attachments to their assigned Gmail plus-address. Accepted files enter the Ideal review queue and receive a receipt. The example address is not a real organization alias.</desc><defs><marker id="email-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155EAD"/></marker></defs><rect width="1048" height="216" rx="16" fill="#FFFFFF"/><rect x="14" y="25" width="266" height="118" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="31" y="58" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Approved sender</text><text x="31" y="94" font-size="23" fill="#087E8B" font-family="Arial, sans-serif" font-weight="700">people@example.org</text><text x="31" y="125" font-size="17" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Exact address Ideal authorized</text><path d="M283 85 L320 85" stroke="#155EAD" stroke-width="3" fill="none"/><polygon points="320,85 310.0,90.0 310.0,80.0" fill="#155EAD"/><rect x="333" y="25" width="388" height="118" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="351" y="58" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Assigned organization address</text><text x="351" y="92" font-size="23" fill="#087E8B" font-family="Arial, sans-serif" font-weight="700">eligibility+org-example</text><text x="351" y="121" font-size="23" fill="#087E8B" font-family="Arial, sans-serif" font-weight="700">@getidealoh.com</text><path d="M724 85 L761 85" stroke="#155EAD" stroke-width="3" fill="none"/><polygon points="761,85 751.0,90.0 751.0,80.0" fill="#155EAD"/><rect x="774" y="25" width="259" height="118" rx="12" fill="#EDF7F1" stroke="#B5D7C2"/><text x="793" y="58" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Ideal review queue</text><text x="793" y="94" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Receipt after acceptance</text><text x="793" y="125" font-size="17" fill="#536575" font-family="Arial, sans-serif" font-weight="400">No automatic coverage change</text><rect x="14" y="162" width="1019" height="42" rx="12" fill="#FFF7E5" stroke="#EDD59A"/><text x="30" y="189" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Example only. Use your assigned plus-address in full, including the +org-… portion.</text></svg>