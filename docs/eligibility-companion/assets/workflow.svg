<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="270" viewBox="0 0 1048 270" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">Three intake methods, one staff workflow</title><desc id="workflow-desc">Browser, email and HTTPS files converge on staff review, approval, processing and verification. Member invitations and vendor delivery are separate steps.</desc><defs><marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155EAD"/></marker></defs><rect width="1048" height="270" rx="16" fill="#FFFFFF"/><rect x="16" y="20" width="174" height="48" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="30" y="51" font-size="18" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Browser upload</text><rect x="16" y="87" width="174" height="48" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="30" y="118" font-size="18" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Email attachment</text><rect x="16" y="154" width="174" height="48" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="30" y="185" font-size="18" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">HTTPS automation</text><path d="M190 44 L213 44 L213 111 L244 111" stroke="#155EAD" stroke-width="2.5" fill="none"/><path d="M190 111 L213 111 L213 111 L244 111" stroke="#155EAD" stroke-width="2.5" fill="none"/><path d="M190 178 L213 178 L213 111 L244 111" stroke="#155EAD" stroke-width="2.5" fill="none"/><rect x="244" y="75" width="162" height="74" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="259" y="104" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Review</text><text x="259" y="131" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Preview + check</text><rect x="440" y="75" width="162" height="74" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="455" y="104" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Approve</text><text x="455" y="131" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Save for import</text><rect x="636" y="75" width="162" height="74" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="651" y="104" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Process</text><text x="651" y="131" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Add / update</text><rect x="834" y="75" width="196" height="74" rx="12" fill="#EDF7F1" stroke="#DCE5ED"/><text x="849" y="104" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Verify</text><text x="849" y="131" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Counts + issues</text><path d="M406 111 L436 111" stroke="#155EAD" stroke-width="3" fill="none"/><polygon points="436,111 426.0,116.0 426.0,106.0" fill="#155EAD"/><path d="M602 111 L632 111" stroke="#155EAD" stroke-width="3" fill="none"/><polygon points="632,111 622.0,116.0 622.0,106.0" fill="#155EAD"/><path d="M798 111 L830 111" stroke="#155EAD" stroke-width="3" fill="none"/><polygon points="830,111 820.0,116.0 820.0,106.0" fill="#155EAD"/><rect x="244" y="184" width="786" height="65" rx="12" fill="#FFF7E5" stroke="#EDD59A"/><text x="261" y="211" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Separate next steps: member invitations and vendor delivery</text><text x="261" y="239" font-size="18" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">A receipt, approval, or completed import does not confirm benefit activation.</text></svg>