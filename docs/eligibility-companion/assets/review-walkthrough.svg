<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="300" viewBox="0 0 1048 300" role="img" aria-labelledby="review-walkthrough-title review-walkthrough-desc"><title id="review-walkthrough-title">Annotated review queue and preview</title><desc id="review-walkthrough-desc">Example queue and staff preview. Approval is a separate action from processing. Missing-field warnings require explicit acknowledgement when present.</desc><defs><marker id="review-walkthrough-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155EAD"/></marker></defs><rect width="1048" height="300" rx="16" fill="#FFFFFF"/><rect x="14" y="15" width="478" height="270" rx="12" fill="#FFFFFF" stroke="#DCE5ED"/><text x="34" y="51" font-size="28" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Review queue</text><text x="34" y="87" font-size="21" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Show: Awaiting review</text><rect x="34" y="108" width="438" height="90" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="48" y="139" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Example Organization · example.csv</text><text x="48" y="168" font-size="20" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">people@example.org · submitted</text><rect x="34" y="216" width="125" height="39" rx="12" fill="#155EAD" stroke="#155EAD"/><text x="54" y="243" font-size="22" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Preview</text><text x="183" y="243" font-size="22" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Reject</text><path d="M494 149 L530 149" stroke="#155EAD" stroke-width="3" fill="none"/><polygon points="530,149 520.0,154.0 520.0,144.0" fill="#155EAD"/><rect x="542" y="15" width="490" height="270" rx="12" fill="#FFFFFF" stroke="#DCE5ED"/><text x="564" y="51" font-size="27" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Review eligibility file</text><text x="564" y="92" font-size="22" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">1 primary member · 2 dependents</text><text x="564" y="126" font-size="21" fill="#287A49" font-family="Arial, sans-serif" font-weight="400">0 parsing issues · 0 validation issues</text><rect x="564" y="146" width="444" height="52" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="579" y="179" font-size="21" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Sample members: Jane Example</text><rect x="564" y="217" width="161" height="38" rx="12" fill="#155EAD" stroke="#155EAD"/><text x="580" y="243" font-size="22" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Approve file</text><text x="754" y="243" font-size="22" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Close</text></svg>