<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="460" viewBox="0 0 1048 460" role="img" aria-labelledby="portal-walkthrough-title portal-walkthrough-desc"><title id="portal-walkthrough-title">Annotated employer upload screen</title><desc id="portal-walkthrough-desc">Illustrated interface using example data, with callouts for organization, roster date, file selection, submission and receipt. The real screen can vary.</desc><defs><marker id="portal-walkthrough-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155EAD"/></marker></defs><rect width="1048" height="460" rx="16" fill="#FFFFFF"/><rect x="14" y="14" width="692" height="429" rx="12" fill="#FFFFFF" stroke="#DCE5ED"/><rect x="14" y="14" width="692" height="46" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><text x="34" y="45" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Ideal Oral Health · Employer uploads</text><text x="40" y="98" font-size="29" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Submit an eligibility file</text><circle cx="52" cy="139" r="17" fill="#155EAD"/><text x="46" y="146" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">1</text><text x="82" y="147" font-size="20" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Organization</text><rect x="82" y="158" width="559" height="39" rx="12" fill="#FFFFFF" stroke="#DCE5ED"/><text x="96" y="185" font-size="22" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Example Organization</text><circle cx="52" cy="222" r="17" fill="#155EAD"/><text x="46" y="229" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">2</text><text x="82" y="230" font-size="20" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Roster date (optional)</text><rect x="82" y="241" width="248" height="35" rx="12" fill="#FFFFFF" stroke="#DCE5ED"/><text x="95" y="267" font-size="21" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">2026-10-05</text><circle cx="52" cy="297" r="17" fill="#155EAD"/><text x="46" y="304" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">3</text><text x="82" y="305" font-size="20" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Eligibility file</text><text x="82" y="333" font-size="21" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Choose File   example-eligibility.csv</text><text x="82" y="357" font-size="20" fill="#155EAD" font-family="Arial, sans-serif" font-weight="400">Download a blank CSV template</text><circle cx="52" cy="391" r="17" fill="#155EAD"/><text x="46" y="398" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">4</text><rect x="82" y="371" width="232" height="38" rx="12" fill="#155EAD" stroke="#155EAD"/><text x="98" y="397" font-size="21" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Submit for review</text><circle cx="679" cy="419" r="17" fill="#155EAD"/><text x="673" y="426" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">5</text><rect x="340" y="371" width="304" height="54" rx="12" fill="#EDF7F1" stroke="#B5D7C2"/><text x="355" y="393" font-size="21" fill="#287A49" font-family="Arial, sans-serif" font-weight="700">Received for review</text><text x="355" y="416" font-size="18" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Receipt: [submission ID]</text><text x="741" y="42" font-size="25" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Follow these callouts</text><circle cx="754" cy="86" r="17" fill="#155EAD"/><text x="748" y="93" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">1</text><text x="784" y="93" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Confirm organization</text><text x="741" y="125" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Only your approved groups appear.</text><circle cx="754" cy="163" r="17" fill="#155EAD"/><text x="748" y="170" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">2</text><text x="784" y="170" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Set the roster date</text><text x="741" y="202" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Use the file’s as-of date, if known.</text><circle cx="754" cy="240" r="17" fill="#155EAD"/><text x="748" y="247" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">3</text><text x="784" y="247" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Choose your file</text><text x="741" y="279" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">CSV, XLSX, TXT or JSON; ≤10 MB.</text><circle cx="754" cy="317" r="17" fill="#155EAD"/><text x="748" y="324" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">4</text><text x="784" y="324" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Submit once</text><text x="741" y="356" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Stay on the page until it finishes.</text><circle cx="754" cy="394" r="17" fill="#155EAD"/><text x="748" y="401" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">5</text><text x="784" y="401" font-size="21" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Keep the receipt</text><text x="741" y="433" font-size="18" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Check Recent submissions below.</text></svg>