<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="150" viewBox="0 0 1048 150" role="img" aria-labelledby="organization-workflow-title organization-workflow-desc"><title id="organization-workflow-title">Your submission journey</title><desc id="organization-workflow-desc">Prepare a roster, submit it, save its receipt and wait for Ideal review. A receipt is not confirmation of coverage.</desc><defs><marker id="organization-workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155EAD"/></marker></defs><rect width="1048" height="150" rx="16" fill="#FFFFFF"/><rect x="14" y="22" width="228" height="85" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><circle cx="41" cy="48" r="17" fill="#155EAD"/><text x="35" y="55" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">1</text><text x="66" y="54" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Prepare</text><text x="30" y="84" font-size="19" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Use the agreed template</text><rect x="278" y="22" width="228" height="85" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><circle cx="305" cy="48" r="17" fill="#155EAD"/><text x="299" y="55" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">2</text><text x="330" y="54" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Submit</text><text x="294" y="84" font-size="19" fill="#536575" font-family="Arial, sans-serif" font-weight="400">Use one upload method</text><rect x="542" y="22" width="228" height="85" rx="12" fill="#F3F7FA" stroke="#DCE5ED"/><circle cx="569" cy="48" r="17" fill="#155EAD"/><text x="563" y="55" font-size="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">3</text><text x="594" y="54" font-size="23" fill="#14324B" font-family="Arial, sans-serif" font-weight="700">Save receipt</text>