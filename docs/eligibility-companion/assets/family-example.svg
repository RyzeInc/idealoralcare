<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="232" viewBox="0 0 1048 232" role="img" aria-labelledby="family-example-title family-example-desc"><title id="family-example-title">One family, three roster rows</title><desc id="family-example-desc">A fictitious employee, spouse and child share the employee identity on each row while covered person fields differ. Names are combined here; the CSV has separate first and last name columns.</desc><defs><marker id="family-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155EAD"/></marker></defs><rect width="1048" height="232" rx="16" fill="#FFFFFF"/><rect x="12" y="16" width="1024" height="188" rx="12" fill="#FFFFFF" stroke="#DCE5ED"/><rect x="12" y="16" width="1024" height="44" rx="0" fill="#14324B" stroke="#14324B"/><text x="25" y="45" font-size="19" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Employee name</text><text x="241" y="45" font-size="19" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Employee DOB</text><text x="420" y="45" font-size="19" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Employee ID</text><text x="579" y="45" font-size="19" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Covered person</text><text x="795" y="45" font-size="19" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Covered DOB</text><text x="943" y="45" font-size="19" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="700">Relation</text><rect x="13" y="61" width="1022" height="44" rx="0" fill="#EAF5F5" stroke="#DCE5ED"/><text x="25" y="90" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="400">Jane Example</text><text x="241" y="90" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="400">1990-01-01</text><text x="420" y="90" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="700">EMP-001</text><text x="579" y="90" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Jane Example</text><text x="795" y="90" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">1990-01-01</text><text x="943" y="90" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Employee</text><rect x="13" y="108" width="1022" height="44" rx="0" fill="#FFFFFF" stroke="#DCE5ED"/><text x="25" y="137" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="400">Jane Example</text><text x="241" y="137" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="400">1990-01-01</text><text x="420" y="137" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="700">EMP-001</text><text x="579" y="137" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Sam Example</text><text x="795" y="137" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">1991-04-15</text><text x="943" y="137" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Spouse</text><rect x="13" y="155" width="1022" height="44" rx="0" fill="#EAF5F5" stroke="#DCE5ED"/><text x="25" y="184" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="400">Jane Example</text><text x="241" y="184" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="400">1990-01-01</text><text x="420" y="184" font-size="19" fill="#087E8B" font-family="Arial, sans-serif" font-weight="700">EMP-001</text><text x="579" y="184" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Alex Example</text><text x="795" y="184" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">2018-06-10</text><text x="943" y="184" font-size="19" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Child</text><text x="20" y="225" font-size="20" fill="#233C50" font-family="Arial, sans-serif" font-weight="400">Repeat the employee’s identity. Change the covered person and relationship on each row.</text></svg>